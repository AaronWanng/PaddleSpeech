name: Build Docker Image for ARM and Push to DockerHub

on:
  push:
    branches:
      - main  # 触发推送到 main 分支时
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Set up Docker Buildx for multi-architecture builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Enable QEMU support for ARM architecture
      - name: Set up QEMU for ARM architecture
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      # Step 4: Log in to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: wf1996
          password: dckr_pat_wYOF31-6N8rQ9nSyKdRV6sf3PKA

      # Step 5: Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: docker/ubuntu18-cpu/Dockerfile  # Dockerfile的路径
          push: true
          tags: wf1996/paddle:latest
          platforms: linux/amd64,linux/arm64  # 支持x86_64和arm64架构

      # Optional Step 6: Clean up
      - name: Clean up
        run: docker system prune -f
